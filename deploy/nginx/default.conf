# Serves the static web build. Single-page app: unknown paths fall back to index.html.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # expo-sqlite on the web runs SQLite in a worker with SharedArrayBuffer,
    # which browsers only allow on cross-origin-isolated pages.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles and assets can be cached for a long time.
    location ~* \.(js|wasm|png|jpg|jpeg|gif|svg|ttf|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # The service worker and manifest must always be fresh.
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
